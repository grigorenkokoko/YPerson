[project]
name = "yperson-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pip-tools==7.6.1",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
