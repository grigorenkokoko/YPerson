openapi: 3.0.0
info:
  title: YPerson API
  version: 2.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is ready
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${YC_HTTP_CONTAINER_ID}
        service_account_id: ${YC_GATEWAY_SA_ID}
  /config:
    get:
      operationId: config
      responses:
        "200":
          description: Public application configuration
        "304":
          description: Configuration is unchanged
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${YC_HTTP_CONTAINER_ID}
        service_account_id: ${YC_GATEWAY_SA_ID}
  /privacy:
    get:
      operationId: privacy
      responses:
        "200":
          description: Technical privacy information
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${YC_HTTP_CONTAINER_ID}
        service_account_id: ${YC_GATEWAY_SA_ID}
  /support:
    get:
      operationId: support
      responses:
        "200":
          description: Technical support information
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${YC_HTTP_CONTAINER_ID}
        service_account_id: ${YC_GATEWAY_SA_ID}
  /sync:
    post:
      operationId: sync
      responses:
        "200":
          description: Authenticated sync operation completed
        "400":
          description: Invalid sync request
        "401":
          description: Invalid installation credential
        "409":
          description: Operation conflict or expired exchange
        "413":
          description: Request body is too large
        "415":
          description: Unsupported media type
        "503":
          description: Durable sync dependency is unavailable
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: ${YC_HTTP_CONTAINER_ID}
        service_account_id: ${YC_GATEWAY_SA_ID}
